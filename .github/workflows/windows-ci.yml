name: Windows CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Windows CI
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/ecommerce-ci-venv
      UV_CACHE_DIR: ${{ runner.temp }}/ecommerce-ci-cache
    steps:
      - name: Check out tested revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pinned uv and Python
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.12.9"
          python-version: "3.12.14"
          enable-cache: "false"
      - name: Prepare locked development dependencies
        shell: pwsh
        run: |
          uv sync --locked --group dev
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency preparation failed' }
      - name: Check package, scenarios and mock protocol
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Record tested event and revision
        if: always()
        shell: pwsh
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          @(
            "Event: $env:GITHUB_EVENT_NAME"
            "Ref: $env:GITHUB_REF"
            "Run SHA: $env:GITHUB_SHA"
            "Source head SHA: $env:SOURCE_HEAD_SHA"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
